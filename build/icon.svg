<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img">
  <title>Poko</title>
  <!-- Poko's app icon: the character as a speech bubble on a warm orange squircle
       (macOS icon grid: 824px body). The bubble tail says "someone to talk to". -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59A6C"/>
      <stop offset="1" stop-color="#D65F35"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2927"/>
      <stop offset="1" stop-color="#0D0C0B"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(512 556) scale(1.08) translate(-512 -556)">
    <ellipse cx="512" cy="806" rx="200" ry="24" fill="#000" opacity="0.16"/>
    <path d="M330 700L272 812Q264 830 284 826L432 768Z" fill="#141312"/>
    <path d="M262 590C262 418 374 318 512 318C650 318 762 418 762 590C762 718 662 786 512 786C362 786 262 718 262 590Z" fill="url(#body)"/>
    <ellipse cx="398" cy="420" rx="70" ry="32" transform="rotate(-32 398 420)" fill="#fff" opacity="0.13"/>
    <rect x="424" y="470" width="54" height="108" rx="27" fill="#FBF7F0"/>
    <rect x="546" y="470" width="54" height="108" rx="27" fill="#FBF7F0"/>
    <ellipse cx="378" cy="628" rx="40" ry="22" fill="#F0846A" opacity="0.85"/>
    <ellipse cx="646" cy="628" rx="40" ry="22" fill="#F0846A" opacity="0.85"/>
    <path d="M486 622q26 22 52 0" fill="none" stroke="#FBF7F0" stroke-width="13" stroke-linecap="round"/>
    <!-- The companion dot, in cream so it stays visible on the orange. -->
    <circle cx="752" cy="292" r="48" fill="#FFF3E4"/>
    <circle cx="738" cy="276" r="13" fill="#fff" opacity="0.45"/>
  </g>
</svg>
